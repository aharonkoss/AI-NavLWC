<template>
    <main class="main-container">
        <div>
            <!-- Top Company Context Bar (Optional/Toggleable via @api showCompanyHeader) -->
            <template if:true={showCompanyHeader}>
                <div class="company-bar">
                    <div class="company-bar-inner">
                        <div class="company-bar-left">
                            <a class="back-link" href="javascript:void(0);" onclick={handleBack}>←</a>
                            <h1 class="company-name">{companyName}</h1>
                            <span class="divider">|</span>
                            <span class="company-location">{companyLocation}</span>
                            <span class="divider">|</span>
                            <a
                                href={companyUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                class="company-url"
                            >
                                {companyUrl}
                            </a>
                            <span class="divider">|</span>
                            <span class="status-badge">{companyStatus}</span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Main Call Plan Card -->
            <div class="card">
                <!-- Gradient Header -->
                <div class="card-header">
                    <div class="card-header-inner">
                        <div>
                            <h2 class="card-title">{planHeaderTitle}</h2>
                        </div>
                        <button
                            class="btn-download"
                            onclick={handleDownloadPdf}
                            disabled={isDownloading}
                        >
                            Download PDF
                        </button>
                    </div>
                </div>

                <!-- Card Body -->
                <div class="card-body">
                    <div>
                        <!-- Subheader -->
                        <div class="compass-header">
                            <h3 class="compass-title">The Conversation Compass℠</h3>
                            <div class="compass-subtitle">
                                Discovery Call Plan: Build Trust · Frame Discussion · Discovery · Joint Commitment
                            </div>
                        </div>

                        <div class="content-stack">
                            <!-- Blue Conversation Banner -->
                            <div class="conversation-banner">
                                <div class="banner-title">{bannerTitle}</div>
                                <div class="banner-subtitle">{bannerSubtitle}</div>
                            </div>

                            <!-- Objective -->
                            <div class="objective-row">
                                <span class="objective-label">Objective: </span>
                                <span class="objective-text">{objectiveText}</span>
                            </div>

                            <!-- Phases Container -->
                            <div class="phases-wrapper">
                                <div class="pov-note">{povNote}</div>

                                <div class="phases-stack">
                                    <!-- Phase 1: Build Trust & Credibility -->
                                    <div class="phase-block phase-border-blue">
                                        <h4 class="phase-heading">
                                            <span class="phase-badge badge-blue">Phase 1</span>
                                            Build Trust &amp; Credibility
                                        </h4>
                                        <div class="phase-items">
                                            <template for:each={phase1Items} for:item="item">
                                                <div key={item.id} class="prompt-box bg-gray">
                                                    <span class="prompt-label text-gray-muted">{item.label}</span>
                                                    <p class="prompt-quote">"{item.quote}"</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Phase 2: Frame The Discussion -->
                                    <div class="phase-block phase-border-green">
                                        <h4 class="phase-heading">
                                            <span class="phase-badge badge-green">Phase 2</span>
                                            Frame The Discussion
                                        </h4>
                                        <div class="phase-items">
                                            <template for:each={phase2Items} for:item="item">
                                                <div key={item.id} class="prompt-box bg-gray">
                                                    <span class="prompt-label text-gray-muted">{item.label}</span>
                                                    <p class="prompt-quote">"{item.quote}"</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Phase 3: Discovery Conversation -->
                                    <div class="phase-block phase-border-teal">
                                        <h4 class="phase-heading">
                                            <span class="phase-badge badge-teal">Phase 3</span>
                                            Discovery Conversation
                                            <span class="phase-heading-sub">(Four Disciplines Applied)</span>
                                        </h4>
                                        <div class="phase-items">
                                            <template for:each={phase3Items} for:item="step">
                                                <div key={step.id} class={step.boxClass}>
                                                    <span class={step.labelClass}>{step.label}</span>
                                                    <p class="prompt-quote">"{step.quote}"</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Phase 4: Joint Commitment -->
                                    <div class="phase-block phase-border-slate">
                                        <h4 class="phase-heading">
                                            <span class="phase-badge badge-slate">Phase 4</span>
                                            Joint Commitment
                                        </h4>
                                        <div class="phase-items">
                                            <template for:each={phase4Items} for:item="item">
                                                <div key={item.id} class="prompt-box bg-gray">
                                                    <span class="prompt-label text-gray-muted">{item.label}</span>
                                                    <p class="prompt-quote">"{item.quote}"</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Bottom Calibration Grid -->
                            <div class="calibration-grid">
                                <div class="calibration-card calibration-amber">
                                    <div class="calibration-title text-amber">
                                        ⟲ If they're actually EARLIER in the journey
                                    </div>
                                    <div class="calibration-body">{earlierJourneyText}</div>
                                </div>
                                <div class="calibration-card calibration-green">
                                    <div class="calibration-title text-green">
                                        ⟳ If they're FURTHER ALONG
                                    </div>
                                    <div class="calibration-body">{furtherAlongText}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Notes Button -->
            <button class="fab-notes" title="Open notes" onclick={toggleNotesDrawer}>
                <svg class="icon-md text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                    ></path>
                </svg>
            </button>

            <!-- Slide-out Notes Drawer -->
            <div class={drawerClasses} style={drawerStyle}>
                <div class="drawer-header">
                    <div class="drawer-header-left">
                        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                            ></path>
                        </svg>
                        <h2 class="drawer-title">My Notes</h2>
                        <span class="drawer-count">{notesCount}</span>
                    </div>
                    <div class="drawer-header-right">
                        <span class="drawer-width-label">480px</span>
                        <button class="drawer-close-btn" onclick={toggleNotesDrawer}>
                            <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"
                                ></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="drawer-company-bar">
                    <p class="drawer-company-text">
                        <span class="font-medium">Company:</span> {companyName}
                    </p>
                </div>

                <div class="drawer-action-bar">
                    <button class="btn-add-note" onclick={handleAddNote}>
                        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 4v16m8-8H4"
                            ></path>
                        </svg>
                        Add New Note
                    </button>
                </div>

                <div class="drawer-body">
                    <div class="empty-notes">
                        <svg class="icon-xl" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                            ></path>
                        </svg>
                        <p class="empty-notes-title">No notes yet</p>
                        <p class="empty-notes-sub">
                            Click the + button on sections to add notes, or create one manually above.
                        </p>
                    </div>
                </div>

                <div class="drawer-footer">
                    <div class="drawer-footer-inner">
                        <span>Drag left edge to resize</span>
                        <span>|</span>
                        <span>Notes saved per company</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</template>
