<!--
  @description       : Discovery Call Insights matching React/Tailwind design with 2-col grid, batch note add, and c-notes-window
-->
<template>
  <div class="cdi-wrapper">
    <!-- ── Header Bar ── -->
    <div class="cdi-header-card">
      <div class="cdi-header-content">
        <h2 class="cdi-main-title">Discovery Call Insights</h2>
        <button
          class="cdi-download-btn"
          onclick={handleDownloadPdf}
          disabled={isDownloadingPdf}
          title="Download Discovery Call Insights PDF"
        >
          <template if:true={isDownloadingPdf}>
            <span class="cdi-btn-spinner"></span>
            <span>Downloading...</span>
          </template>
          <template if:false={isDownloadingPdf}>
            <span>Download PDF</span>
          </template>
        </button>
      </div>
    </div>

    <!-- ── Loading State ── -->
    <template if:true={isLoading}>
      <div class="cdi-loading">
        <div class="cdi-spinner"></div>
        <span>Loading Discovery Call Insights...</span>
      </div>
    </template>

    <!-- ── Error Banner ── -->
    <template if:true={error}>
      <div class="cdi-error-box">
        <span class="cdi-error-icon">&#9888;</span>
        <span>{error}</span>
      </div>
    </template>

    <!-- ── Main Content Cards ── -->
    <template if:false={isLoading}>
      <div class="cdi-content-container">

        <!-- 1. Company Profile Card -->
        <template if:true={companyProfile}>
          <div class="cdi-card">
            <div class="cdi-card-header">
              <h3 class="cdi-card-title">Company Profile</h3>
              <button
                type="button"
                class={companyProfileBtnClass}
                onclick={handleAddCompanyProfileToNotes}
                title={companyProfileBtnTitle}
              >
                <template if:true={isCompanyProfileInNotes}>
                  <svg class="cdi-action-icon cdi-icon-check" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                  </svg>
                </template>
                <template if:false={isCompanyProfileInNotes}>
                  <svg class="cdi-action-icon cdi-icon-plus" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </template>
              </button>
            </div>
            <div class="cdi-card-body">
              <template if:true={companyProfile.businessType}>
                <div class="cdi-field-row">
                  <span class="cdi-field-label">Business Type: </span>
                  <span class="cdi-field-text">{companyProfile.businessType}</span>
                </div>
              </template>
              <template if:true={companyProfile.keyCharacteristics}>
                <div class="cdi-field-row">
                  <span class="cdi-field-label">Key Characteristics: </span>
                  <span class="cdi-field-text">{companyProfile.keyCharacteristics}</span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 2. Call Strategy Card -->
        <template if:true={callStrategy}>
          <div class="cdi-card">
            <div class="cdi-card-header">
              <h3 class="cdi-card-title">Call Strategy</h3>
              <button
                type="button"
                class={callStrategyBtnClass}
                onclick={handleAddCallStrategyToNotes}
                title={callStrategyBtnTitle}
              >
                <template if:true={isCallStrategyInNotes}>
                  <svg class="cdi-action-icon cdi-icon-check" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                  </svg>
                </template>
                <template if:false={isCallStrategyInNotes}>
                  <svg class="cdi-action-icon cdi-icon-plus" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </template>
              </button>
            </div>
            <div class="cdi-card-body">
              <!-- Primary Objective -->
              <template if:true={callStrategy.primaryObjective}>
                <div class="cdi-sub-block">
                  <h4 class="cdi-sub-title">Primary Objective:</h4>
                  <p class="cdi-sub-text">{callStrategy.primaryObjective}</p>
                </div>
              </template>

              <!-- Key Focus Areas -->
              <template if:true={hasKeyFocusAreas}>
                <div class="cdi-sub-block">
                  <h4 class="cdi-sub-title">Key Focus Areas:</h4>
                  <ul class="cdi-bullet-list">
                    <template for:each={callStrategy.keyFocusAreas} for:item="item">
                      <li key={item} class="cdi-bullet-item">
                        <span class="cdi-bullet-dot">•</span>
                        <span>{item}</span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>

              <!-- Relationship Approach -->
              <template if:true={callStrategy.relationshipApproach}>
                <div class="cdi-sub-block">
                  <h4 class="cdi-sub-title">Relationship Approach:</h4>
                  <p class="cdi-sub-text">{callStrategy.relationshipApproach}</p>
                </div>
              </template>

              <!-- Follow-up Actions -->
              <template if:true={hasFollowUpActions}>
                <div class="cdi-sub-block">
                  <h4 class="cdi-sub-title">Follow-up Actions:</h4>
                  <ul class="cdi-bullet-list">
                    <template for:each={callStrategy.followUpActions} for:item="item">
                      <li key={item} class="cdi-bullet-item">
                        <span class="cdi-bullet-dot">•</span>
                        <span>{item}</span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 3. Strategic Insights Section with Select-All & 2-Col Grid -->
        <template if:true={hasInsights}>
          <div class="cdi-insights-section">
            <!-- Section Header Bar (Title with Count + Select-All Button) -->
            <div class="cdi-section-header-row">
              <h3 class="cdi-section-heading">{strategicInsightsHeading}</h3>
              <button
                type="button"
                class={allInsightsBtnClass}
                onclick={handleAddAllInsightsToNotes}
                title={allInsightsBtnTitle}
              >
                <template if:true={allInsightsInNotes}>
                  <svg class="cdi-action-icon cdi-icon-check" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                  </svg>
                </template>
                <template if:false={allInsightsInNotes}>
                  <svg class="cdi-action-icon cdi-icon-plus" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </template>
              </button>
            </div>

            <!-- 2-Column Responsive Grid -->
            <div class="cdi-grid-2col">
              <template for:each={insights} for:item="ins">
                <div key={ins.title} class="cdi-card cdi-tile-card">
                  <!-- Tile Top Action & Badges Row -->
                  <div class="cdi-tile-top-row">
                    <button
                      type="button"
                      class={ins.noteBtnClass}
                      onclick={handleAddInsightToNotes}
                      data-title={ins.title}
                      title={ins.noteBtnTitle}
                    >
                      <template if:true={ins.isAddedToNotes}>
                        <svg class="cdi-action-icon cdi-icon-check" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                        </svg>
                      </template>
                      <template if:false={ins.isAddedToNotes}>
                        <svg class="cdi-action-icon cdi-icon-plus" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                      </template>
                    </button>

                    <div class="cdi-badge-group">
                      <span class={ins.categoryClass}>{ins.category}</span>
                      <span class={ins.priorityClass}>{ins.priority}</span>
                    </div>
                  </div>

                  <!-- Tile Heading -->
                  <h4 class="cdi-tile-title">{ins.title}</h4>

                  <!-- Data Trigger Box -->
                  <template if:true={ins.rawDataTrigger}>
                    <div class="cdi-trigger-box">
                      <span class="cdi-trigger-label">Data Trigger: </span>
                      <span class="cdi-trigger-text">{ins.rawDataTrigger}</span>
                    </div>
                  </template>

                  <!-- Insight Narrative -->
                  <template if:true={ins.insight}>
                    <p class="cdi-insight-text">{ins.insight}</p>
                  </template>

                  <!-- Business Need -->
                  <template if:true={ins.businessNeed}>
                    <div class="cdi-field-block">
                      <span class="cdi-field-label">Business Need: </span>
                      <span class="cdi-field-value">{ins.businessNeed}</span>
                    </div>
                  </template>

                  <!-- Discovery Questions -->
                  <template if:true={ins.hasQuestions}>
                    <div class="cdi-questions-block">
                      <h5 class="cdi-questions-title">Discovery Questions</h5>
                      <ul class="cdi-questions-list">
                        <template for:each={ins.discoveryQuestions} for:item="q">
                          <li key={q} class="cdi-question-item">{q}</li>
                        </template>
                      </ul>
                    </div>
                  </template>

                  <!-- Rationale -->
                  <template if:true={ins.rationale}>
                    <div class="cdi-field-block">
                      <span class="cdi-field-label">Rationale: </span>
                      <span class="cdi-field-value cdi-text-muted">{ins.rationale}</span>
                    </div>
                  </template>

                  <!-- Advisory Opportunity Box -->
                  <template if:true={ins.advisoryOpportunity}>
                    <div class="cdi-advisory-box">
                      <h5 class="cdi-advisory-title">Advisory Opportunity</h5>
                      <p class="cdi-advisory-text">{ins.advisoryOpportunity}</p>
                    </div>
                  </template>

                  <!-- Expected Outcome Box -->
                  <template if:true={ins.expectedOutcome}>
                    <div class="cdi-outcome-box">
                      <h5 class="cdi-outcome-title">Expected Outcome</h5>
                      <p class="cdi-outcome-text">{ins.expectedOutcome}</p>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>

      </div>
    </template>

    <!-- Reusable Notes Window Child Component -->
    <c-notes-window
      company-id={companyId}
      company-name={companyDisplayName}
      source-tab="Discovery Call Insights"
      onnotesupdated={handleNotesUpdated}
    ></c-notes-window>
  </div>
</template>
