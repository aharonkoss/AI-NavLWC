<!--
  @description       : Leadership & Executive drawer component with in-memory data caching
-->
<template>
  <div class="cdr-subtab-container leadership">
    <div class="cdr-subtab-content">
      <!-- Loading Spinner -->
      <template if:true={leadershipIsLoading}>
        <div class="cdr-loading leader-loading">
          <div class="cdr-spinner leader-spinner"></div>
          <span>Loading leadership data...</span>
        </div>
      </template>

      <!-- Error Banner -->
      <template if:true={leadershipHasError}>
        <div class="cdr-error">
          <span class="cdr-error-icon">&#9888;</span>
          <span>{leadershipError}</span>
        </div>
      </template>

      <!-- Data View -->
      <template if:true={leadershipHasExecutives}>
        <div class="ldr-outer-card">
          <!-- Card Header -->
          <div class="ldr-card-header">
            <div class="ldr-card-header-left">
              <span class="ldr-header-icon-wrap" aria-hidden="true">
                <svg
                  class="ldr-header-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <span class="ldr-header-title">Leadership</span>
              <span class="ldr-count-badge">{leadershipCountLabel}</span>
            </div>
            <div class="ldr-card-header-right">
              <button
                class="ldr-refresh-btn"
                title="Refresh leadership data"
                onclick={handleLeadershipRefresh}
              >
                &#8635;
              </button>
            </div>
          </div>

          <!-- Executive Master Cards -->
          <div class="ldr-card-body leader-list">
            <template for:each={leadershipExecutives} for:item="exec">
              <div key={exec.id} class="ldr-exec-card leader-card">
                
                <!-- 1. Hero Profile Header (Fix #1: Uses .ldr-hero-subcard .leader-profile WITHOUT .ldr-subcard) -->
                <div class="ldr-hero-subcard leader-profile">
                  <div class="ldr-avatar-wrap">
                    <template if:true={exec.hasProfilePic}>
                      <img
                        class="ldr-avatar-img leader-avatar-img"
                        src={exec.profilePicUrl}
                        alt={exec.fullName}
                      />
                    </template>
                    <template if:false={exec.hasProfilePic}>
                      <div class="ldr-avatar leader-avatar-initial">{exec.initials}</div>
                    </template>
                  </div>
                  <div class="ldr-exec-hero-info">
                    <div class="ldr-exec-name-row">
                      <span class="ldr-exec-name leader-name">{exec.fullName}</span>
                      <button
                        class={exec.noteBtnClass}
                        title={exec.noteBtnTitle}
                        data-id={exec.id}
                        onclick={handleLeaderNoteClick}
                      >
                        <template if:true={exec.hasNote}>
                          <span class="ldr-check-icon">&#10003;</span>
                        </template>
                        <template if:false={exec.hasNote}>
                          <span class="ldr-plus-icon">+</span>
                        </template>
                      </button>
                    </div>

                    <template if:true={exec.designation}>
                      <div class="ldr-exec-designation leader-title">{exec.designation}</div>
                    </template>
                    <template if:true={exec.company}>
                      <div class="ldr-exec-company-name leader-employer">{exec.company}</div>
                    </template>
                    <template if:true={exec.location}>
                      <div class="ldr-exec-location leader-location">
                        <svg
                          class="ldr-loc-icon"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"
                          />
                          <circle cx="12" cy="10" r="3" />
                        </svg>
                        {exec.location}
                      </div>
                    </template>
                  </div>
                  <template if:true={exec.confidenceLabel}>
                    <span class={exec.confidenceClass}>{exec.confidenceLabel}</span>
                  </template>
                </div>

                <!-- 2. Contact Grid (Email, Phone, Social Profiles) -->
                <div class="ldr-contact-grid leader-contact-grid">
                  <!-- Email Sub-Card -->
                  <template if:true={exec.hasEmails}>
                    <div class="ldr-subcard contact-panel">
                      <div class="ldr-section-header contact-panel-heading">
                        <svg
                          class="ldr-section-icon"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                          />
                          <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <span class="ldr-section-title">Email ({exec.emailCount})</span>
                      </div>
                      <div class="ldr-section-body contact-items">
                        <template for:each={exec.emails} for:item="em">
                          <div key={em.email} class="ldr-contact-row contact-item">
                            <span class="ldr-contact-value contact-item-value">{em.email}</span>
                            <div class="ldr-badge-group">
                              <span class="ldr-type-badge badge badge-professional" data-type={em.type}>{em.type}</span>
                              <template if:true={em.grade}>
                                <span class="ldr-grade-badge badge" data-grade={em.grade}>{em.grade}</span>
                              </template>
                            </div>
                          </div>
                        </template>
                        <template if:true={exec.recommendedEmail}>
                          <div class="ldr-recommended-email-box">
                            Recommended: {exec.recommendedEmail.email}
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Phone Sub-Card -->
                  <template if:true={exec.hasPhones}>
                    <div class="ldr-subcard contact-panel">
                      <div class="ldr-section-header contact-panel-heading">
                        <svg
                          class="ldr-section-icon"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.59 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
                          />
                        </svg>
                        <span class="ldr-section-title">Phone ({exec.phoneCount})</span>
                      </div>
                      <div class="ldr-section-body contact-items">
                        <template for:each={exec.phones} for:item="ph">
                          <div key={ph.number} class="ldr-contact-row contact-item">
                            <span class="ldr-contact-value contact-item-value">{ph.number}</span>
                            <div class="ldr-badge-group">
                              <template if:true={ph.recommended}>
                                <span class="ldr-recommended-badge badge badge-valid">Recommended</span>
                              </template>
                              <template if:true={ph.type}>
                                <span class="ldr-type-badge badge badge-professional">{ph.type}</span>
                              </template>
                              <template if:true={ph.status}>
                                <span class="ldr-valid-badge badge badge-valid">{ph.status}</span>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Social Profiles Sub-Card -->
                  <template if:true={exec.hasLinkedIn}>
                    <div class="ldr-subcard contact-panel">
                      <div class="ldr-section-header contact-panel-heading">
                        <svg
                          class="ldr-section-icon"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                          />
                          <path
                            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                          />
                        </svg>
                        <span class="ldr-section-title">Social Profiles</span>
                      </div>
                      <div class="ldr-section-body ldr-social-body">
                        <a
                          class="ldr-social-btn"
                          href={exec.linkedInUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          <svg
                            class="ldr-social-icon ldr-social-icon--linkedin"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                          >
                            <path
                              d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                            />
                            <rect x="2" y="9" width="4" height="12" />
                            <circle cx="4" cy="4" r="2" />
                          </svg>
                          LinkedIn Profile
                        </a>
                        <template if:true={exec.hasTwitter}>
                          <a
                            class="ldr-social-btn"
                            href={exec.twitterUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            <svg
                              class="ldr-social-icon ldr-social-icon--twitter"
                              xmlns="http://www.w3.org/2000/svg"
                              viewBox="0 0 24 24"
                              fill="currentColor"
                            >
                              <path
                                d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.43.36a9 9 0 0 1-2.88 1.1A4.52 4.52 0 0 0 16.11 0c-2.5 0-4.52 2-4.52 4.52 0 .35.04.7.11 1.03C7.69 5.4 4.07 3.58 1.64.9a4.5 4.5 0 0 0-.61 2.27c0 1.57.8 2.95 2.01 3.76a4.5 4.5 0 0 1-2.05-.56v.06c0 2.19 1.56 4.02 3.63 4.43a4.5 4.5 0 0 1-2.04.08 4.53 4.53 0 0 0 4.22 3.14A9.06 9.06 0 0 1 0 19.54a12.8 12.8 0 0 0 6.92 2.03c8.3 0 12.85-6.88 12.85-12.85 0-.2 0-.39-.01-.58A9.18 9.18 0 0 0 23 3z"
                              />
                            </svg>
                            Twitter
                          </a>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- 3. Current Employer Sub-Card -->
                <template if:true={exec.hasCurrentEmployer}>
                  <div class="ldr-subcard contact-panel">
                    <div class="ldr-section-header contact-panel-heading">
                      <svg
                        class="ldr-section-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                      </svg>
                      <span class="ldr-section-title">Current Employer</span>
                    </div>
                    <div class="ldr-employer-grid">
                      <div class="ldr-employer-col">
                        <span class="ldr-employer-label">Company</span>
                        <span class="ldr-employer-value">{exec.currentCompany}</span>
                      </div>
                      <div class="ldr-employer-col">
                        <span class="ldr-employer-label">Industry</span>
                        <span class="ldr-employer-value">{exec.industry}</span>
                      </div>
                      <div class="ldr-employer-col">
                        <span class="ldr-employer-label">Website</span>
                        <template if:true={exec.websiteUrl}>
                          <a class="ldr-employer-link" href={exec.websiteUrl} target="_blank" rel="noopener noreferrer">{exec.websiteDisplay}</a>
                        </template>
                        <template if:false={exec.websiteUrl}>
                          <span class="ldr-employer-value">-</span>
                        </template>
                      </div>
                      <div class="ldr-employer-col">
                        <span class="ldr-employer-label">LinkedIn</span>
                        <template if:true={exec.companyLinkedInUrl}>
                          <a class="ldr-employer-link" href={exec.companyLinkedInUrl} target="_blank" rel="noopener noreferrer">Company Page</a>
                        </template>
                        <template if:false={exec.companyLinkedInUrl}>
                          <span class="ldr-employer-value">-</span>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- 4. Employment History (Fix #2: Uses {job.rowClass} to bind to controller data) -->
                <template if:true={exec.hasJobHistory}>
                  <div class="ldr-subcard contact-panel">
                    <div class="ldr-section-header contact-panel-heading">
                      <svg
                        class="ldr-section-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                      </svg>
                      <span class="ldr-section-title">
                        Employment History ({exec.jobHistoryCount})
                      </span>
                    </div>
                    <div class="ldr-job-list contact-items">
                      <template for:each={exec.jobHistory} for:item="job">
                        <div key={job.key} class={job.rowClass}>
                          <div class="ldr-job-title-row">
                            <span class="ldr-job-title">{job.title}</span>
                            <template if:true={job.isCurrent}>
                              <span class="ldr-current-badge badge badge-valid">Current</span>
                            </template>
                          </div>
                          <div class="ldr-job-company">{job.company}</div>
                          <div class="ldr-job-dates">{job.startDate} - {job.endDate}</div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- 5. Education -->
                <template if:true={exec.hasEducation}>
                  <div class="ldr-subcard contact-panel">
                    <div class="ldr-section-header contact-panel-heading">
                      <svg
                        class="ldr-section-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                        <path d="M6 12v5c3 3 9 3 12 0v-5" />
                      </svg>
                      <span class="ldr-section-title">
                        Education ({exec.educationCount})
                      </span>
                    </div>
                    <div class="ldr-edu-list contact-items">
                      <template for:each={exec.education} for:item="edu">
                        <div key={edu.key} class="ldr-edu-row contact-item">
                          <div class="ldr-edu-school">{edu.school}</div>
                          <template if:true={edu.degree}>
                            <div class="ldr-edu-degree">{edu.degree}</div>
                          </template>
                          <template if:true={edu.major}>
                            <div class="ldr-edu-major">Field: {edu.major}</div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- 6. Skills -->
                <template if:true={exec.hasSkills}>
                  <div class="ldr-subcard contact-panel">
                    <div class="ldr-section-header contact-panel-heading">
                      <svg
                        class="ldr-section-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <circle cx="12" cy="8" r="6" />
                        <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" />
                      </svg>
                      <span class="ldr-section-title">Skills ({exec.skillCount})</span>
                    </div>
                    <div class="ldr-section-body ldr-skills-body">
                      <template for:each={exec.skills} for:item="skill">
                        <span key={skill} class="ldr-skill-pill">{skill}</span>
                      </template>
                    </div>
                  </div>
                </template>

              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Empty State -->
      <template if:true={leadershipShowEmptyState}>
        <div class="cdr-empty leader-empty">
          <span class="cdr-empty-icon">&#128100;</span>
          <p>No leadership data found for this company.</p>
        </div>
      </template>
    </div>

    <!-- Floating Circular Notes Button -->
    <template if:false={isNotesOpen}>
      <button
        class="ldr-floating-notes-btn"
        title="Open Notes"
        onclick={toggleNotesDrawer}
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
        <template if:true={notesCount}>
          <span class="ldr-floating-badge">{notesCount}</span>
        </template>
      </button>
    </template>

    <!-- Slide-in Notes Drawer -->
    <template if:true={isNotesOpen}>
      <div class="ldr-notes-drawer" style={drawerStyle}>
        <div class="ldr-resize-handle" onmousedown={startResize}></div>

        <div class="ldr-drawer-header">
          <div class="ldr-drawer-header-left">
            <span class="ldr-drawer-icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
            </span>
            <span class="ldr-drawer-title">My Notes</span>
            <span class="ldr-notes-count-badge">{notesCount}</span>
          </div>
          <div class="ldr-drawer-header-right">
            <span class="ldr-drawer-width-label">{drawerWidth}px</span>
            <button class="ldr-drawer-btn" title="Print Notes" onclick={handlePrintNotes}>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 6 2 18 2 18 9" />
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                <rect x="6" y="14" width="12" height="8" />
              </svg>
            </button>
            <button class="ldr-drawer-btn" title="Close" onclick={toggleNotesDrawer}>
              &#10005;
            </button>
          </div>
        </div>

        <div class="ldr-drawer-body">
          <div class="ldr-drawer-company-row">
            <strong>Company:</strong> {displayCompanyName}
          </div>

          <template if:false={isAddingNote}>
            <button class="ldr-add-note-dash-btn" onclick={handleOpenAddNoteForm}>
              <span class="ldr-add-note-plus">+</span> Add New Note
            </button>
          </template>

          <template if:true={isAddingNote}>
            <div class="ldr-note-form-card">
              <input
                type="text"
                class="ldr-note-title-input"
                placeholder="Note title (optional)"
                value={newNoteTitle}
                oninput={handleNoteTitleChange}
              />
              <div class="ldr-note-editor-wrapper">
                <textarea
                  class="ldr-note-textarea"
                  rows="4"
                  placeholder="Enter your note..."
                  oninput={handleNoteContentChange}
                >{newNoteContent}</textarea>
                <div class="ldr-note-toolbar">
                  <button type="button" class="ldr-tool-btn" title="Bold" onclick={handleToolBold}><strong>B</strong></button>
                  <button type="button" class="ldr-tool-btn" title="Italic" onclick={handleToolItalic}><em>/</em></button>
                  <button type="button" class="ldr-tool-btn" title="List" onclick={handleToolBullet}>&#9776;</button>
                </div>
              </div>
              <div class="ldr-note-form-actions">
                <button type="button" class="ldr-btn-cancel" onclick={handleCancelNoteForm}>Cancel</button>
                <button type="button" class="ldr-btn-save" disabled={isSavingNote} onclick={handleSaveNote}>
                  <template if:true={isSavingNote}>Saving...</template>
                  <template if:false={isSavingNote}>Save Note</template>
                </button>
              </div>
            </div>
          </template>

          <template if:true={isLoadingNotes}>
            <div class="ldr-notes-loading">
              <div class="cdr-spinner"></div>
              <span>Loading notes...</span>
            </div>
          </template>

          <div class="ldr-notes-list">
            <template for:each={notesList} for:item="note">
              <div key={note.id} class="ldr-note-accordion-item">
                <div class="ldr-note-accordion-header" data-id={note.id} onclick={toggleNoteAccordion}>
                  <div class="ldr-note-header-left">
                    <span class={note.chevronClass}></span>
                    <span class="ldr-note-item-title">{note.title}</span>
                  </div>
                  <div class="ldr-note-item-date">{note.formattedDate}</div>
                </div>

                <template if:true={note.isExpanded}>
                  <div class="ldr-note-accordion-body">
                    <div class="ldr-note-tag-wrapper">
                      <span class="ldr-note-tag-badge">{note.tagLabel}</span>
                    </div>

                    <template if:false={note.isEditing}>
                      <div class="ldr-note-body-content-box">
                        <p class="ldr-note-body-text">{note.content}</p>
                      </div>
                      <div class="ldr-note-action-icons">
                        <button class="ldr-note-icon-btn" title="Edit Note" data-id={note.id} onclick={handleStartEditNote}>
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                          </svg>
                        </button>
                        <button class="ldr-note-icon-btn" title="Delete Note" data-id={note.id} onclick={handleDeleteNote}>
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                          </svg>
                        </button>
                      </div>
                    </template>

                    <template if:true={note.isEditing}>
                      <div class="ldr-note-inline-edit">
                        <textarea class="ldr-note-textarea" rows="4" data-id={note.id} oninput={handleInlineContentChange}>{note.editContent}</textarea>
                        <div class="ldr-note-form-actions">
                          <button type="button" class="ldr-btn-cancel" data-id={note.id} onclick={handleCancelInlineEdit}>Cancel</button>
                          <button type="button" class="ldr-btn-save" data-id={note.id} onclick={handleSaveInlineEdit}>Save</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div class="ldr-drawer-footer">
          <span>Drag left edge to resize</span>
          <span class="ldr-footer-divider">|</span>
          <span>Notes saved per company</span>
        </div>
      </div>
    </template>
  </div>
</template>
