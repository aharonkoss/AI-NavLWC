<!--
  @description       : Company Detail Research parent container with eager parallel tab preloading
-->
<template>
  <div class="cdr-wrapper">
    <!-- Sub-Tab Bar with Download PDF Button -->
    <div class="cdr-subtab-bar">
      <!-- Left: Tabs List -->
      <div class="cdr-subtab-list">
        <template for:each={researchSubTabs} for:item="tab">
          <button
            key={tab.id}
            class={tab.cssClass}
            data-id={tab.id}
            onclick={handleSubTabChange}
          >
            {tab.label}
          </button>
        </template>
      </div>

      <!-- Right: Download PDF Button -->
      <template if:true={showDownloadPdfButton}>
        <div class="cdr-download-wrap">
          <button
            class="cdr-download-btn"
            onclick={handleDownloadPdf}
            disabled={isDownloadingPdf}
            title="Download PDF for the active tab"
          >
            <template if:true={isDownloadingPdf}>
              <span class="cdr-btn-spinner"></span>
              <span>Downloading...</span>
            </template>
            <template if:false={isDownloadingPdf}>
              <span>Download PDF</span>
            </template>
          </button>
        </div>
      </template>
    </div>

    <!-- Parallel Eager-Loaded Tab Containers -->
    <div class="cdr-tab-container">
      <!-- 1. Research Library (Active on load) -->
      <div class={researchLibraryTabClass}>
        <c-research-library company-id={companyId}></c-research-library>
      </div>

      <!-- 2. Leadership (Preloaded in background on load) -->
      <div class={leadershipTabClass}>
        <c-detail-leadship company-id={companyId}></c-detail-leadship>
      </div>

      <!-- 3. UCC (Preloaded in background on load) -->
      <div class={uccTabClass}>
        <c-detail-ucc company-id={companyId}></c-detail-ucc>
      </div>

      <!-- 4. RMA (Optional / Lazily Loaded) -->
      <template if:true={visitedTabs.rma}>
        <div class={rmaTabClass}>
          <c-detail-rma company-id={companyId}></c-detail-rma>
        </div>
      </template>

      <!-- 5. Equifax (Optional / Lazily Loaded) -->
      <template if:true={visitedTabs.equifax}>
        <div class={equifaxTabClass}>
          <c-detai-equifax company-id={companyId}></c-detai-equifax>
        </div>
      </template>
    </div>
  </div>
</template>
