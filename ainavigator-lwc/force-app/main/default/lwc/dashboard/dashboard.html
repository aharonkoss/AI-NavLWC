<template>
    <div class="dashboard-wrapper">

        <!-- Custom Toast Notification -->
        <template if:true={shareMessage}>
            <div class={toastClass}>
                <div class="toast-content">
                    {shareMessage.text}
                </div>
            </div>
        </template>

        <!-- Page Title -->
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
        </div>

        <!-- KPI Stats Cards (Unchanged) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-row">
                    <div class="stat-icon icon-blue"><span class="icon-letter">T</span></div>
                    <div>
                        <p class="stat-label">Total</p>
                        <p class="stat-value">{totalCompanies}</p>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-row">
                    <div class="stat-icon icon-amber"><span class="icon-letter">P</span></div>
                    <div>
                        <p class="stat-label">Processing</p>
                        <p class="stat-value text-amber">{processing}</p>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-row">
                    <div class="stat-icon icon-green"><span class="icon-letter">C</span></div>
                    <div>
                        <p class="stat-label">Completed</p>
                        <p class="stat-value text-green">{completed}</p>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-row">
                    <div class="stat-icon icon-purple"><span class="icon-letter">O</span></div>
                    <div>
                        <p class="stat-label">Opened</p>
                        <p class="stat-value text-purple">{opened}</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Companies Section -->
        <div class="companies-card">

            <!-- Companies Header & Search -->
            <div class="companies-header">
                <h2 class="companies-title">
                    Companies <span class="companies-count">({filteredCount})</span>
                </h2>
                <div class="search-wrapper">
                    <input type="text" placeholder="Search..." value={searchTerm} oninput={handleSearchChange} class="search-input" />
                </div>
                <div class="filter-wrapper">
                    <select value={companyFilter} onchange={handleFilterChange} class="filter-select">
                        <template for:each={filterOptions} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Bulk Share Toolbar (PDF Step 1) -->
            <template if:true={showShareToolbar}>
                <div class="share-toolbar">
                    <div class="toolbar-left">
                        <input type="checkbox" onchange={handleSelectAll} class="checkbox-main" />
                        <span class="selection-count">{selectionCountLabel}</span>
                    </div>
                    <div class="toolbar-right">
                        <select class="teammate-select" onchange={handleTeammateChange} value={shareTargetUserId}>
                            <option value="">Share with...</option>
                            <template if:true={teammates.data}>
                                <template for:each={teammates.data} for:item="tm">
                                    <option key={tm.value} value={tm.value}>{tm.label}</option>
                                </template>
                            </template>
                        </select>
                        <button class="btn-share-primary" onclick={handleShare} disabled={isShareDisabled}>
                            <span if:false={isSharing}>Share</span>
                            <span if:true={isSharing} class="spinner-small"></span>
                        </button>
                        <button class="btn-cancel" onclick={handleCancelSelection}>Cancel</button>
                    </div>
                </div>
            </template>

            <!-- Companies List -->
            <div class="companies-list">
                <template if:true={hasCompanies}>
                    <template for:each={paginatedCompanies} for:item="company">
                        <div key={company.companyId} 
                            class="company-row" 
                            data-companyid={company.companyId} 
                            onclick={handleCompanyClick}
                        >
                            
                            <!-- Checkbox (New) -->
                            <div class="company-check-col" onclick={stopPropagation}>
                                <input type="checkbox" 
                                    data-companyid={company.companyId} 
                                    checked={company.isSelected}
                                    onchange={handleRowSelect} 
                                    disabled={company.hasSharedLabel} />
                            </div>

                            <!-- Company Name + "Shared by" Label (PDF Page 2) -->
                            <div class="company-name-col">
                                <span class="company-name">{company.name}</span>
                                <template if:true={company.hasSharedLabel}>
                                    <p class="shared-by-tag">
                                        <svg class="icon-share-small" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                                        {company.sharedByLabel}
                                    </p>
                                </template>
                                <template if:false={company.hasSharedLabel}>
                                    <p class="company-location">{company.locationDisplay}</p>
                                </template>
                            </div>

                            <!-- Submitted Date -->
                            <div class="company-date-col">
                                <span class="date-text">{company.createdAtDisplay}</span>
                            </div>

                            <!-- Stage & Client Type (Unchanged) -->
                            <div class="company-dropdown-col" onclick={stopPropagation}>
                                <select class="dropdown-stage" data-companyid={company.companyId} onchange={handleStageChange}>
                                    <option value="PreCall" selected={company.stageIsPreCall}>PreCall</option>
                                    <option value="Appointment Set" selected={company.stageIsAppointmentSet}>Appointment Set</option>
                                    <option value="Face To Face" selected={company.stageIsFaceToFace}>Face To Face</option>
                                    <option value="Qualification" selected={company.stageIsQualification}>Qualification</option>
                                </select>
                            </div>
                            <div class="company-dropdown-col" onclick={stopPropagation}>
                                <select class="dropdown-clienttype" data-companyid={company.companyId} onchange={handleClientTypeChange}>
                                    <option value="Prospect" selected={company.clientTypeIsProspect}>Prospect</option>
                                    <option value="Existing Customer" selected={company.clientTypeIsExisting}>Existing Customer</option>
                                    <option value="Past Customer" selected={company.clientTypeIsPast}>Past Customer</option>
                                </select>
                            </div>

                            <!-- Signals Badge (Unchanged) -->
                            <div class="company-signals-col" onclick={stopPropagation}>
                                <button class={company.signalBadgeClass} data-companyid={company.companyId} onclick={handleOpenSignals}>
                                    <span class="signal-icon">⚡</span>
                                    <span>{company.signalBadgeLabel}</span>
                                </button>
                            </div>

                            <!-- Status & Actions -->
                            <div class="company-status-col">
                                <span class={company.statusClass}>{company.statusLabel}</span>
                            </div>

                            <div class="company-actions-col" onclick={stopPropagation}>
                                <!-- PDF: Show Unshare icon if shared with others -->
                                <template if:true={company.showUnshareButton}>
                                    <button class="btn-action btn-unshare" data-companyid={company.companyId} onclick={handleOpenUnshareModal} title="Manage access">
                                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                    </button>
                                </template>
                                <!-- Standard Delete -->
                                <button class="btn-action btn-delete" data-companyid={company.companyId} onclick={handleDelete} title="Delete">
                                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </div>

        <!-- Unshare Management Modal -->
        <template if:true={isUnshareModalOpen}>
            <div class="modal-backdrop" onclick={handleCloseUnshareModal}>
                <div class="modal-content" onclick={stopPropagation}>
                    <div class="modal-header">
                        <h3>Manage Access: {currentUnshareCompanyName}</h3>
                    </div>
                    <div class="modal-body">
                        <p class="modal-instruction">This company is shared with the following teammates. Click to remove their access.</p>
                        <ul class="user-access-list">
                            <template for:each={sharedWithUsersList} for:item="user">
                                <li key={user.id} class="user-access-item">
                                    <span class="user-name">{user.name}</span>
                                    <button class="btn-remove-access" data-sharedid={user.id} onclick={handleConfirmUnshare}>Remove</button>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-modal-close" onclick={handleCloseUnshareModal}>Close</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Confirm Delete Modal -->
        <template if:true={isDeleteModalOpen}>
            <div class="modal-backdrop" onclick={handleCloseDeleteModal}>
                <div class="modal-content" onclick={stopPropagation}>
                    <div class="modal-header">
                        <h3>Delete Company</h3>
                    </div>
                    <div class="modal-body">
                        <p class="modal-instruction">Are you sure you want to delete company "<strong>{companyToDeleteName}</strong>"? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-modal-close" onclick={handleCloseDeleteModal}>Cancel</button>
                        <button class="btn-confirm-delete" onclick={handleConfirmDelete}>Ok</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
